name: Release
# Runs when a v* tag is pushed. Checks that the tag names the version the package carries and that the release notes
# exist, runs the unit tests, builds the wheel and sdist the way the clean-install CI job does, and publishes a GitHub
# release carrying both and docs/releases/<tag>.md as its notes. Publishing to PyPI is not here yet (#4): it needs the
# trusted publisher to exist first, and no token is ever stored in this repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build and publish the GitHub release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag names the version the package carries, and the release notes exist
        run: |
          version="$(PYTHONPATH=src python -c 'import egrit_preflight; print(egrit_preflight.__version__)')"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1; }
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "docs/releases/$GITHUB_REF_NAME.md is missing: write the release notes first"; exit 1; }
      - name: Unit tests (mocked Docker; not hardware verification)
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -q
      - name: Build the wheel and sdist, install the wheel in an isolated venv, run the CLI
        run: |
          python -m pip install build==1.2.2
          python -m build
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/egrit-preflight --version
      - name: Publish the GitHub release with the notes and the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Egrit-Preflight $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
